  <!-- Canonical -->
  <!-- 没有静态 canonical：Caddy 把同一份 index.html 回落给所有路由，写死
       指向 / 会让 /album、相册页和 /tools 全部自我 canonical 掉，永远进不了
       索引。缺省时搜索引擎以 URL 自身为 canonical，正是我们要的；执行 JS 的
       客户端由 App.tsx 的 CanonicalSync 补上自引用的那条。 -->

  <!-- 能跑 JS 的浏览器标一个 js 类：#root 里给爬虫读的静态简历就藏起来、换成加载圈（样式见 scripts/geo.mjs 的 SHELL_STYLE）。
       要在 <body> 解析前就执行，所以写在 head 里，且 data-cfasync="false"：
       Cloudflare Rocket Loader 会把普通脚本推迟到页面渲染之后，那时简历已经闪出来了 -->
  <script data-cfasync="false">document.documentElement.classList.add('js');</script>

  <!-- Google tag (gtag.js)。data-cfasync="false"：不经 Rocket Loader，load 事件才一定监听得到 -->
  <script data-cfasync="false">
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-LWL6MY0GF4');

    // 统计脚本有 178KB，但首屏用不到它：等页面加载完、浏览器空闲了再下载。
    // 上面的 gtag(...) 调用先排在 dataLayer 里，脚本到了会补发，统计数据不会丢
    window.addEventListener('load', function () {
      var loadGtag = function () {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-LWL6MY0GF4';
        document.head.appendChild(s);
      };
      if ('requestIdleCallback' in window) {
        requestIdleCallback(loadGtag, { timeout: 3000 });
      } else {
        setTimeout(loadGtag, 2000);
      }
    });
  </script>

  <!-- Structured Data —— 由 scripts/geo.mjs 从 src/i18n 生成，别手写 -->
  <!--geo-jsonld-->
</head>
<body>
<!-- #root 的初始内容由 scripts/geo.mjs 从 src/i18n 生成：React 挂载前是首屏
     加载态，挂载后被整体替换，关掉 JS 就一直是它。原来那段手写的 noscript
     简介删了 —— 正文提取器会把 noscript 整段丢掉，AI 爬虫因此只读得到标题。 -->
<div id="root"><!--geo--></div>
<script type="module" src="/src/main.jsx"></script>
</body>
