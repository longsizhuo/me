# pnpm 11 起，overrides 等设置从 package.json 的 "pnpm" 字段迁到这里。
# 这两条是安全 pin，别删 —— 放回 package.json 会被 pnpm 11 静默忽略：
#   yaml             — 见 commit fd2c575
#   follow-redirects — 见 commit e76a5d0
overrides:
  yaml: '>=2.8.3'
  follow-redirects: '>=1.16.0'

# esbuild 的 postinstall 只是下载对应平台的二进制，放行。
allowBuilds:
  esbuild: true

# pnpm 11 默认拒装刚发布的版本（供应链防护）。char-anime 是自己发的包，发版当天就要用，豁免这一版。
minimumReleaseAgeExclude:
  - char-anime@0.2.0
